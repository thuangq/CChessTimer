<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đồng Hồ Cờ Tướng 3D Pro</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Đồng Hồ Cờ">
  <meta name="theme-color" content="#0a0c10">
  
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%2300f2fe'><rect width='100' height='100' rx='22' fill='%230a0c10'/><text x='50%' y='68%' font-size='60' text-anchor='middle' fill='%2300f2fe'>⏱️</text></svg>">
  <link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Đồng Hồ Cờ Tướng Pro&quot;,&quot;short_name&quot;:&quot;Đồng Hồ Cờ&quot;,&quot;start_url&quot;:&quot;./&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%230a0c10&quot;,&quot;theme_color&quot;:&quot;%230a0c10&quot;}">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Orbitron:wght@700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Chakra Petch', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { 
      display: flex; flex-direction: column; height: 100vh; 
      background: #06080b; color: #f0f6fc; user-select: none; 
      overflow: hidden; padding: 12px; gap: 10px;
    }

    /* Vùng chứa khung nút bấm 3D */
    .player-wrapper {
      flex: 1; display: flex; width: 100%; position: relative;
    }
    #wrapper-p1 { transform: rotate(180deg); }

    /* Nút bấm nổi khối 3D dầy dặn */
    .player-card {
      width: 100%; height: 100%; display: flex; flex-direction: column; 
      justify-content: center; align-items: center; border: none; cursor: pointer;
      border-radius: 24px; position: relative;
      
      /* Tạo màu kim loại tối bóng dầu */
      background: linear-gradient(180deg, #2a313d 0%, #1a1e26 40%, #11141a 100%);
      
      /* Độ vát khối nổi 3D siêu dầy (Chân đế & Viền bóng) */
      box-shadow: 
        0 12px 0 #090b0e,                       /* Chân đế dầy nổi lên bàn */
        0 15px 25px rgba(0, 0, 0, 0.8),          /* Bóng dổ diện rộng */
        inset 0 3px 2px rgba(255, 255, 255, 0.25),/* Viền việt sáng mép trên */
        inset 0 -3px 5px rgba(0, 0, 0, 0.9);     /* Bóng chìm mép dưới */
      
      transition: all 0.08s ease;
    }

    /* Hiệu ứng lún nút 3D khi bấm vào */
    .player-card:active {
      transform: translateY(8px);
      box-shadow: 
        0 4px 0 #090b0e,                        /* Thu hẹp chân đế */
        0 6px 12px rgba(0, 0, 0, 0.6),
        inset 0 4px 8px rgba(0, 0, 0, 0.8);      /* Lún sâu vào trong */
    }
    
    /* Trạng thái Lượt chơi Active (Đèn Neon & Khối 3D rực rỡ) */
    .player-card.active {
      background: linear-gradient(180deg, #1d3344 0%, #12222e 40%, #0a141c 100%) !important;
      border: 2px solid #00f2fe;
      box-shadow: 
        0 12px 0 #051821,
        0 0 30px rgba(0, 242, 254, 0.4),
        inset 0 3px 3px rgba(0, 242, 254, 0.5),
        inset 0 -3px 6px rgba(0, 0, 0, 0.9) !important;
    }
    .player-card.active .main-time { color: #00f2fe; text-shadow: 0 0 18px rgba(0, 242, 254, 0.8); }

    /* Trạng thái nguy hiểm Danger (Chớp nháy Đỏ 3D) */
    .player-card.danger {
      background: linear-gradient(180deg, #421823 0%, #290d14 40%, #150509 100%) !important;
      border: 2px solid #ff0055 !important;
      box-shadow: 
        0 12px 0 #180308,
        0 0 35px rgba(255, 0, 85, 0.6),
        inset 0 3px 3px rgba(255, 0, 85, 0.6),
        inset 0 -3px 6px rgba(0, 0, 0, 0.9) !important;
      animation: dangerPulse 0.5s infinite alternate;
    }
    .player-card.danger .main-time { color: #ff0055 !important; text-shadow: 0 0 18px rgba(255, 0, 85, 0.9); }

    @keyframes dangerPulse {
      from { transform: scale(1); }
      to { transform: scale(0.99); }
    }

    .player-card.ready {
      border: 2px dashed #ffab00;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { box-shadow: 0 12px 0 #090b0e, 0 0 5px rgba(255, 171, 0, 0.4); }
      50% { box-shadow: 0 12px 0 #090b0e, 0 0 25px rgba(255, 171, 0, 0.8); }
      100% { box-shadow: 0 12px 0 #090b0e, 0 0 5px rgba(255, 171, 0, 0.4); }
    }

    /* Chữ số đồng hồ LED chìm dạng 3D Screen */
    .main-time {
      font-family: 'Orbitron', monospace; font-size: 4.5rem; font-weight: 900;
      color: #717d8a; letter-spacing: 2px; transition: color 0.3s;
      background: rgba(0, 0, 0, 0.35); padding: 5px 25px; border-radius: 16px;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.8), 0 1px 1px rgba(255,255,255,0.05);
    }
    
    .sub-info {
      font-size: 1rem; color: #8b949e; margin-top: 10px; font-weight: 700;
      display: flex; gap: 14px; background: rgba(0, 0, 0, 0.5); padding: 6px 18px; border-radius: 20px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
    }
    .sub-info span { color: #ffab00; }
    .sub-info .count { color: #00f2fe; }

    /* Thanh điều khiển trung tâm 3D */
    .controls {
      display: flex; justify-content: center; gap: 10px; padding: 6px 0; z-index: 10;
    }
    
    .btn {
      padding: 12px 18px; font-size: 0.95rem; font-weight: 700; border-radius: 14px;
      border: none; cursor: pointer; 
      background: linear-gradient(180deg, #2c333f 0%, #1a1f27 100%); color: #c9d1d9;
      box-shadow: 0 5px 0 #0f1318, 0 5px 10px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.2);
      transition: 0.08s; display: flex; align-items: center; gap: 6px;
    }
    .btn:active { 
      transform: translateY(3px);
      box-shadow: 0 2px 0 #0f1318, 0 2px 5px rgba(0,0,0,0.5);
    }
    .btn-primary { 
      background: linear-gradient(180deg, #1f68e0 0%, #003db8 100%); 
      color: #fff; 
      box-shadow: 0 5px 0 #002266, 0 5px 15px rgba(0, 82, 212, 0.4), inset 0 1px 1px rgba(255,255,255,0.3);
    }
    .btn-primary:active {
      box-shadow: 0 2px 0 #002266, 0 2px 5px rgba(0, 82, 212, 0.4);
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center; z-index: 100;
      opacity: 0; pointer-events: none; transition: 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .modal {
      background: #161b22; padding: 25px; border-radius: 20px; width: 88%; max-width: 380px;
      border: 1px solid #30363d; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .modal h2 { margin-bottom: 20px; text-align: center; color: #00f2fe; font-family: 'Orbitron', sans-serif; font-size: 1.3rem; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #8b949e; }
    .form-group input {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #30363d;
      background: #0d1117; color: #f0f6fc; font-size: 1.1rem; font-family: 'Orbitron', monospace; outline: none;
    }
    .form-group input:focus { border-color: #00f2fe; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
  </style>
</head>
<body>

  <!-- Người chơi 1 -->
  <div class="player-wrapper" id="wrapper-p1">
    <button id="p1" class="player-card" onclick="switchPlayer(1)">
      <div id="p1-main" class="main-time">15:00</div>
      <div class="sub-info">
        <span>Nước: <b id="p1-move">60</b>s</span>
        | <span class="count">Đã đi: <b id="p1-count">0</b></span>
      </div>
    </button>
  </div>

  <!-- Điều khiển trung tâm -->
  <div class="controls">
    <button class="btn btn-primary" onclick="toggleTimer()" id="start-btn">► Sẵn sàng</button>
    <button class="btn" onclick="openSettings()">⚙️ Cài đặt</button>
    <button class="btn" onclick="resetGame()">🔄 Đặt lại</button>
  </div>

  <!-- Người chơi 2 -->
  <div class="player-wrapper">
    <button id="p2" class="player-card" onclick="switchPlayer(2)">
      <div id="p2-main" class="main-time">15:00</div>
      <div class="sub-info">
        <span>Nước: <b id="p2-move">60</b>s</span>
        | <span class="count">Đã đi: <b id="p2-count">0</b></span>
      </div>
    </button>
  </div>

  <!-- Modal Cài đặt -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <h2>CÀI ĐẶT THỜI GIAN</h2>
      <div class="form-group">
        <label>Tổng thời gian ván (Phút):</label>
        <input type="number" id="input-total" min="1" max="180">
      </div>
      <div class="form-group">
        <label>Thời gian 1 nước (Giây):</label>
        <input type="number" id="input-move" min="5" max="300">
      </div>
      <div class="form-group">
        <label>Cộng thêm mỗi nước (Giây):</label>
        <input type="number" id="input-inc" min="0" max="60">
      </div>
      <div class="form-group">
        <label>Cảnh báo âm thanh (Giây cuối - 0 để tắt):</label>
        <input type="number" id="input-tension" min="0" max="30">
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeSettings()">Hủy</button>
        <button class="btn btn-primary" onclick="saveSettings()">Lưu cấu hình</button>
      </div>
    </div>
  </div>

  <script>
    // Khởi tạo các giá trị từ LocalStorage hoặc mặc định
    let totalMinutes = parseInt(localStorage.getItem('chess_total')) || 15;
    let maxMoveSeconds = parseInt(localStorage.getItem('chess_move')) || 60;
    let incrementSeconds = parseInt(localStorage.getItem('chess_inc')) || 5;
    let tensionSeconds = parseInt(localStorage.getItem('chess_tension')) || 10;

    let p1Main, p2Main, p1Move, p2Move, p1Count = 0, p2Count = 0;
    let activePlayer = null, timer = null, audioCtx = null, wakeLock = null;
    let gameState = 'IDLE';

    // Bật Wake Lock giữ màn hình luôn sáng
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function playBeep(freq = 440, type = 'sine', duration = 0.1) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type; osc.frequency.value = freq;
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function playTensionSound(timeLeft) {
      if (tensionSeconds <= 0 || timeLeft > tensionSeconds || timeLeft <= 0) return;

      const progress = timeLeft / tensionSeconds;
      if (progress > 0.5) {
        playBeep(400 + (1 - progress) * 400, 'sine', 0.08);
      } else if (timeLeft > 1) {
        playBeep(800 + (0.5 - progress) * 800, 'square', 0.06);
      } else if (timeLeft === 1) {
        playBeep(1200, 'sawtooth', 0.25);
      }
    }

    function initDisplay() {
      p1Main = p2Main = totalMinutes * 60;
      p1Move = p2Move = maxMoveSeconds;
      p1Count = p2Count = 0;
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById('p1-main').innerText = formatTime(p1Main);
      document.getElementById('p2-main').innerText = formatTime(p2Main);
      document.getElementById('p1-move').innerText = p1Move;
      document.getElementById('p2-move').innerText = p2Move;
      document.getElementById('p1-count').innerText = p1Count;
      document.getElementById('p2-count').innerText = p2Count;
    }

    function formatTime(sec) {
      let m = Math.floor(sec / 60), s = sec % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function toggleTimer() {
      getAudioContext();
      triggerHaptic();

      if (gameState === 'RUNNING') {
        clearInterval(timer); timer = null;
        gameState = 'IDLE';
        releaseWakeLock();
        document.getElementById('start-btn').innerHTML = '► Tiếp tục';
      } else if (gameState === 'IDLE') {
        gameState = 'READY';
        requestWakeLock();
        document.getElementById('start-btn').innerHTML = '❚❚ Tạm dừng';
        document.getElementById('p1').classList.add('ready');
        document.getElementById('p2').classList.add('ready');
      }
    }

    function switchPlayer(playerWhoPressed) {
      if (gameState === 'IDLE') return;

      triggerHaptic();
      playBeep(700, 'square', 0.04);

      if (gameState === 'READY') {
        document.getElementById('p1').classList.remove('ready');
        document.getElementById('p2').classList.remove('ready');
        activePlayer = (playerWhoPressed === 1) ? 2 : 1;
        if (playerWhoPressed === 1) p1Count++; else p2Count++;
        startCountdown();
        return;
      }

      if (activePlayer !== playerWhoPressed) return;

      if (activePlayer === 1) { p1Main += incrementSeconds; p1Move = maxMoveSeconds; p1Count++; activePlayer = 2; }
      else { p2Main += incrementSeconds; p2Move = maxMoveSeconds; p2Count++; activePlayer = 1; }

      updateActiveUI();
      updateDisplay();
    }

    function updateActiveUI() {
      const p1El = document.getElementById('p1');
      const p2El = document.getElementById('p2');

      p1El.classList.toggle('active', activePlayer === 1);
      p2El.classList.toggle('active', activePlayer === 2);

      p1El.classList.toggle('danger', activePlayer === 1 && tensionSeconds > 0 && p1Move <= tensionSeconds);
      p2El.classList.toggle('danger', activePlayer === 2 && tensionSeconds > 0 && p2Move <= tensionSeconds);
    }

    function startCountdown() {
      gameState = 'RUNNING';
      requestWakeLock();
      updateActiveUI();

      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        if (activePlayer === 1) {
          p1Main--; p1Move--;
          playTensionSound(p1Move);
          if (p1Main <= 0 || p1Move <= 0) endGame('Người chơi 2 thắng!');
        } else {
          p2Main--; p2Move--;
          playTensionSound(p2Move);
          if (p2Main <= 0 || p2Move <= 0) endGame('Người chơi 1 thắng!');
        }
        updateActiveUI();
        updateDisplay();
      }, 1000);
    }

    function endGame(msg) {
      clearInterval(timer); timer = null;
      gameState = 'IDLE';
      releaseWakeLock();
      playBeep(150, 'sawtooth', 0.8); alert(msg);
    }

    function resetGame() {
      triggerHaptic();
      if (gameState === 'RUNNING' && !confirm('Bạn có chắc muốn đặt lại ván cờ?')) return;

      if (timer) { clearInterval(timer); timer = null; }
      gameState = 'IDLE';
      activePlayer = null;
      releaseWakeLock();
      document.getElementById('p1').classList.remove('active', 'ready', 'danger');
      document.getElementById('p2').classList.remove('active', 'ready', 'danger');
      document.getElementById('start-btn').innerHTML = '► Sẵn sàng';
      initDisplay();
    }

    function openSettings() {
      if (gameState === 'RUNNING') toggleTimer();
      document.getElementById('input-total').value = totalMinutes;
      document.getElementById('input-move').value = maxMoveSeconds;
      document.getElementById('input-inc').value = incrementSeconds;
      document.getElementById('input-tension').value = tensionSeconds;
      document.getElementById('settings-modal').classList.add('active');
    }

    function closeSettings() { document.getElementById('settings-modal').classList.remove('active'); }

    function saveSettings() {
      totalMinutes = parseInt(document.getElementById('input-total').value) || 15;
      maxMoveSeconds = parseInt(document.getElementById('input-move').value) || 60;
      incrementSeconds = parseInt(document.getElementById('input-inc').value) || 0;
      tensionSeconds = parseInt(document.getElementById('input-tension').value) || 0;

      // Lưu tự động vào LocalStorage
      localStorage.setItem('chess_total', totalMinutes);
      localStorage.setItem('chess_move', maxMoveSeconds);
      localStorage.setItem('chess_inc', incrementSeconds);
      localStorage.setItem('chess_tension', tensionSeconds);

      closeSettings(); resetGame();
    }

    if ('serviceWorker' in navigator) {
      const swCode = `self.addEventListener('install', e => e.waitUntil(caches.open('co-v7').then(c => c.addAll(['./'])))); self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));`;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    initDisplay();
  </script>
</body>
</html>
